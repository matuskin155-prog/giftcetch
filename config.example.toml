# Скопируйте этот файл в config.toml и заполните.

[telegram]
# Берутся на https://my.telegram.org → API development tools
api_id = 0
api_hash = ""
session = "giftcatch"          # файл сессии giftcatch.session — никому не передавайте

[search]
# Какие коллекции смотреть: точные названия или маски. ["*"] — все, что есть на вторичке.
gifts = ["*"]
# Какие фоны ловить. Маска "*Black*" поймает и "Black", и "Onyx Black".
backdrops = ["*Black*"]
# both     — нужен и подходящий фон, и красивый номер
# backdrop — только фон, номер любой
# number   — только красивый номер, фон любой
# any      — фон ИЛИ номер
match = "both"
interval = 10                  # пауза между кругами, сек
request_delay = 1.5            # пауза между запросами, сек (меньше — риск флуд-бана)
page_size = 50
first_scan_pages = 20          # при первом проходе коллекции листаем глубже, чтобы найти старые лоты

[numbers]
max_number = 100               # все номера <= 100 — красивые (0 — выключить)
repdigits = true               # 77, 777, 8888
round = true                   # 100, 2000, 50000
sequences = true               # 123, 1234, 4321
palindromes = false            # 1221, 12321
repeats = false                # 1212, 123123
extra = [69, 228, 420, 1337]   # свои номера

[buy]
auto_buy = false               # false — только уведомления в «Избранное»
max_price = 0                  # максимум звёзд за один подарок
budget = 0                     # максимум звёзд за весь запуск
max_count = 1                  # сколько подарков купить и остановиться

[upgrade]
keep_original_details = true   # оставить на подарке отправителя и подпись
max_price = 0                  # не платить за улучшение больше (0 — без лимита, всё равно спросит)
